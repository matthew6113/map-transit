[project]
name = "transit-pipeline"
version = "0.1.0"
description = "Data pipeline for the Bay Area transit map: BAM basemap snapshot, BAM future lines, GTFS, and the app build."
requires-python = ">=3.11,<3.14"
dependencies = [
    "shapely>=2.1",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "pyarrow>=17",
    "pillow>=10",
]

[tool.uv]
package = false
